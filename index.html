<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CADE Conify — Party Cone PFP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #101010;
      --bg-card: #151515;
      --orange: #FF9D00;
      --purple: #8B2CFF;
      --white-warm: #F5F0E8;
      --black-outline: #0a0a0a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--white-warm);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      touch-action: none;
    }

    .app-shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 10px;
    }

    header {
      text-align: center;
      padding: 15px 0 10px;
    }

    .logo-img {
      max-width: 80px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .tagline {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Layout */
    .editor-layout {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }

    .canvas-stage {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .canvas-wrapper canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Tray Layout */
    .tray {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px;
      background: var(--bg-card);
      border: 2px solid #2a2a2a;
      border-radius: 4px;
    }

    @media (min-width: 768px) {
      .tray {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .tray-section {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
    }

    .tray-label {
      font-family: 'Bangers', cursive;
      font-size: 0.55rem;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
      text-align: center;
    }

    .frame-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }

    /* Badge preview gallery */
    .badge-gallery {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 10px;
      background: var(--bg-card);
      border: 2px solid #2a2a2a;
      border-radius: 4px;
      margin-top: 10px;
    }

    .badge-thumb {
      width: 60px;
      height: 40px;
      object-fit: contain;
      border: 2px solid #333;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.1s;
      background: #1e1e1e;
    }

    .badge-thumb:hover {
      border-color: var(--orange);
      transform: scale(1.1);
    }

    .badge-thumb.selected {
      border-color: var(--purple);
      box-shadow: 0 0 8px var(--purple);
    }

    .frame-btn {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 4px;
      padding: 8px 4px;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 2px 2px 0 var(--black-outline);
      transition: all 0.1s;
    }

    .frame-btn:hover {
      background: var(--orange);
      color: #000;
      border-color: var(--orange);
      transform: translate(-1px, -1px);
    }

    .frame-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 10px 8px;
      font-family: 'Bangers', cursive;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--black-outline);
      transition: all 0.1s;
      white-space: nowrap;
    }

    .action-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--black-outline);
    }

    .action-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--black-outline);
    }

    .upload-btn {
      background: var(--orange);
      color: #000;
    }

    .download-btn {
      background: var(--orange);
      color: #000;
    }

    .delete-btn {
      background: #ff4444;
      color: #fff;
    }

    .cone-btn {
      background: var(--purple);
      color: #fff;
    }

    .hint-bar {
      background: #1a1a1a;
      border-left: 3px solid var(--orange);
      padding: 8px 12px;
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .hint-bar strong { color: var(--orange); }

    /* Slider styling */
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--orange);
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <img src="logo.png" alt="CADE Conify" class="logo-img">
      <p class="tagline">☠️ Meme Madness Edition ☠️</p>
    </header>

    <!-- Hidden file input for canvas tap upload -->
    <input type="file" id="upload" accept="image/*" style="display: none;">

    <div class="editor-layout">
      <div class="canvas-stage">
        <div class="canvas-wrapper">
          <canvas id="canvas" width="1000" height="1000"></canvas>
        </div>
        <div class="hint-bar">
          <strong>Tap Add</strong> to place elements · <strong>Select</strong> to pinch/drag/rotate
        </div>
        <div class="hint-bar">
          <strong>Tap Add</strong> to place elements · <strong>Select</strong> to pinch/drag/rotate
        </div>
        <!-- Badge preview gallery -->
        <div class="badge-gallery">
          <img src="badge1.png" alt="Badge 1" class="badge-thumb selected" onclick="selectBadge(0)">
          <img src="badge2.png" alt="Badge 2" class="badge-thumb" onclick="selectBadge(1)">
          <img src="badge3.png" alt="Badge 3" class="badge-thumb" onclick="selectBadge(2)">
          <img src="badge4.png" alt="Badge 4" class="badge-thumb" onclick="selectBadge(3)">
          <img src="badge5.png" alt="Badge 5" class="badge-thumb" onclick="selectBadge(4)">
        </div>
      </div>

      <div class="tray">
        <div class="tray-section">
          <div class="tray-label">Badges</div>
          <button class="action-btn cone-btn" onclick="addBadge(selectedBadgeIndex)">🏅 Add Selected</button>
        </div>

        <div class="tray-section">
          <div class="tray-label">Cone</div>
          <button class="action-btn cone-btn" onclick="addCone()">🎩 Add</button>
        </div>

        <div class="tray-section">
          <div class="tray-label">Actions</div>
          <div class="action-buttons">
            <button class="action-btn delete-btn" onclick="deleteSelected()">🗑</button>
            <button class="action-btn download-btn" onclick="downloadImage()">⬇</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let backgroundImage = null;
    let elements = [];
    let selectedElement = null;
    let selectedBadgeIndex = 0;

    // State for interactions
    let interactionMode = null;
    let initialTouchDistance = null;
    let initialConeSize = null;
    let initialRotation = null;
    let initialAngle = null;
    let lastPinchCenter = null;
    
    // Load cone image
    const coneImage = new Image();
    coneImage.src = 'cone.png';
    coneImage.crossOrigin = 'anonymous';
    let coneImageLoaded = false;
    
    coneImage.onload = () => {
      coneImageLoaded = true;
      draw();
    };
    
    // Frames - removed, using badges now
    const badgeImages = ['badge1.png', 'badge2.png', 'badge3.png', 'badge4.png', 'badge5.png'];
    const badgeImageObjects = {};
    const badgeNames = ['Badge 1', 'Badge 2', 'Badge 3', 'Badge 4', 'Badge 5'];

    // Load all badge images
    for (let i = 0; i < badgeImages.length; i++) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = badgeImages[i];
      badgeImageObjects[badgeImages[i]] = img;
    }
    
    // Get display size of an element
    function getDisplaySize(el) {
      if (el.type === 'image' && el.image && el.image.complete) {
        const w = el.image.naturalWidth * (el.size / 100);
        const h = el.image.naturalHeight * (el.size / 100);
        return { w, h };
      }
      return { w: el.size, h: el.size };
    }
    
    // Check if point is inside element's hit area
    function getElementAt(x, y) {
      for (let i = elements.length - 1; i >= 0; i--) {
        const el = elements[i];
        const { w: nw, h: nh } = getDisplaySize(el);
        // Use circular hit detection for easier selection
        const dist = Math.sqrt((x - el.x) ** 2 + (y - el.y) ** 2);
        if (dist < Math.max(nw, nh) / 2 + 15) return el;
      }
      return null;
    }
    
    // Get canvas coordinates from event
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }
    
    // Get distance between two touch points
    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
    
    // Get midpoint between two touch points
    function getTouchMidpoint(touches) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const midX = ((touches[0].clientX + touches[1].clientX) / 2 - rect.left) * scaleX;
      const midY = ((touches[0].clientY + touches[1].clientY) / 2 - rect.top) * scaleY;
      return { x: midX, y: midY };
    }
    
    // Calculate angle between two touch points for rotation
    function getTouchAngle(touches) {
      const dx = touches[1].clientX - touches[0].clientX;
      const dy = touches[1].clientY - touches[0].clientY;
      return Math.atan2(dy, dx);
    }
    
    // Draw everything
    function draw() {
      // Clear
      ctx.fillStyle = '#101010';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw PFP scaled to fill canvas
      if (backgroundImage) {
        ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Show upload placeholder when no elements and no background
      if (elements.length === 0 && !backgroundImage) {
        ctx.fillStyle = '#666';
        ctx.font = '60px Bangers';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('📁', canvas.width / 2, canvas.height / 2 - 40);
        ctx.font = '40px Space Grotesk';
        ctx.fillText('Upload PFP', canvas.width / 2, canvas.height / 2 + 30);
        ctx.font = '28px Space Grotesk';
        ctx.fillStyle = '#444';
        ctx.fillText('Tap anywhere to upload', canvas.width / 2, canvas.height / 2 + 80);
      }

      // Draw elements (cone and badges)
      elements.forEach(el => {
        drawElement(el, el === selectedElement);
      });
    }
    
    function drawElement(el, selected) {
      const { w: nativeW, h: nativeH } = getDisplaySize(el);
      
      ctx.save();
      ctx.translate(el.x, el.y);
      ctx.rotate(el.rotation * Math.PI / 180);
      
      if (el.type === 'image' && el.image && el.image.complete) {
        ctx.drawImage(el.image, -nativeW/2, -nativeH/2, nativeW, nativeH);
      }
      
      // Selection indicators
      if (selected) {
        // Dashed selection circle (standard mobile gesture indicator)
        ctx.strokeStyle = '#FF9D00';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 3]);
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(nativeW, nativeH) / 2 + 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Center dot
        ctx.fillStyle = '#FF9D00';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      
      ctx.restore();
    }
    
    // Handle single-touch events (drag)
    function handleSingleTouch(e) {
      e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      
      const el = getElementAt(x, y);
      if (el) {
        selectedElement = el;
        isDragging = true;
        dragOffset = { x: x - el.x, y: y - el.y };
      } else {
        selectedElement = null;
        isDragging = false;
      }
      draw();
    }
    
    // Handle touch move for dragging
    function handleTouchMove(e) {
      e.preventDefault();
      if (!isDragging || !selectedElement) return;
      if (e.touches.length !== 1) return;
      
      const { x, y } = getCanvasCoords(e);
      selectedElement.x = x - dragOffset.x;
      selectedElement.y = y - dragOffset.y;
      draw();
    }
    
    // Handle two-touch events (pinch to scale, rotate)
    function handleTwoTouch(e) {
      e.preventDefault();
      if (e.touches.length !== 2) return;
      
      if (!selectedElement) {
        const mid = getTouchMidpoint(e.touches);
        const el = getElementAt(mid.x, mid.y);
        if (el) {
          selectedElement = el;
        }
        if (!selectedElement) return;
      }
      
      // Reset baseline on first two-finger contact
      if (!initialTouchDistance) {
        initialTouchDistance = getTouchDistance(e.touches);
        initialConeSize = selectedElement.size;
        initialRotation = selectedElement.rotation;
        initialAngle = getTouchAngle(e.touches);
        lastPinchCenter = getTouchMidpoint(e.touches);
      }
      
      const currentDist = getTouchDistance(e.touches);
      const currentAngle = getTouchAngle(e.touches);
      const currentMid = getTouchMidpoint(e.touches);
      
      // Scale: ratio of current distance to initial distance
      const scaleRatio = currentDist / initialTouchDistance;
      selectedElement.size = Math.max(10, Math.min(200, initialConeSize * scaleRatio));
      
      // Rotation: difference in angle between current and initial
      let angleDiff = (currentAngle - initialAngle) * 180 / Math.PI;
      selectedElement.rotation = initialRotation + angleDiff;
      
      // Move with pinch center drift
      if (lastPinchCenter) {
        const dx = currentMid.x - lastPinchCenter.x;
        const dy = currentMid.y - lastPinchCenter.y;
        selectedElement.x += dx;
        selectedElement.y += dy;
        lastPinchCenter = currentMid;
      }
      
      draw();
    }
    
    // Reset state when fingers lifted
    function handleTouchEnd(e) {
      e.preventDefault();
      isDragging = false;
      initialTouchDistance = null;
      initialConeSize = null;
      initialRotation = null;
      initialAngle = null;
      lastPinchCenter = null;
      
      // If last touch, continue drag if selected
      if (e.touches.length === 1) {
        const { x, y } = getCanvasCoords(e.touches[0]);
        const el = getElementAt(x, y);
        if (el) {
          isDragging = true;
          dragOffset = { x: x - el.x, y: y - el.y };
        }
      }
      draw();
    }
    
    // Mouse event handlers (desktop)
    function onMouseDown(e) {
      const { x, y } = getCanvasCoords(e);
      const el = getElementAt(x, y);
      if (el) {
        selectedElement = el;
        isDragging = true;
        dragOffset = { x: x - el.x, y: y - el.y };
      } else {
        selectedElement = null;
        isDragging = false;
      }
      draw();
    }
    
    function onMouseMove(e) {
      if (!isDragging || !selectedElement) return;
      e.preventDefault();
      
      const { x, y } = getCanvasCoords(e);
      selectedElement.x = x - dragOffset.x;
      selectedElement.y = y - dragOffset.y;
      draw();
    }
    
    function onMouseUp(e) {
      isDragging = false;
    }
    
    // Track mouse down position for wheel-based rotation
    let mouseDownPos = null;
    
    function onMouseWheel(e) {
      if (!selectedElement) return;
      e.preventDefault();
      
      // Standard scroll to resize (negative = smaller, positive = larger)
      const scaleFactor = e.deltaY > 0 ? 0.95 : 1.05;
      selectedElement.size = Math.max(20, Math.min(300, selectedElement.size * scaleFactor));
      draw();
    }
    
    // Touch event listeners (mobile - industry standard touch gestures)
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        handleSingleTouch(e);
      } else if (e.touches.length === 2) {
        initialAngle = getTouchAngle(e.touches);
        handleTwoTouch(e);
      }
    }, { passive: false });

    // Click handler for upload when canvas is empty
    canvas.addEventListener('click', (e) => {
      const { x, y } = getCanvasCoords(e);

      // If no elements and no background, show upload dialog
      if (elements.length === 0 && !backgroundImage) {
        // Check if click is near center (industry standard)
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const dist = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);

        // Allow tap anywhere on empty canvas
        if (dist < 200 || elements.length === 0) {
          const fileInput = document.getElementById('upload');
          if (fileInput) {
            fileInput.click();
          }
        }
      }
    });

    // File input handler
    const uploadInput = document.getElementById('upload');
    if (uploadInput) {
      uploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            backgroundImage = img;
            draw();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        handleTouchMove(e);
      } else if (e.touches.length === 2) {
        handleTwoTouch(e);
      }
    }, { passive: false });
    
    canvas.addEventListener('touchend', handleTouchEnd);
    canvas.addEventListener('touchcancel', handleTouchEnd);
    
    // Mouse event listeners (desktop)
    canvas.addEventListener('mousedown', onMouseDown);
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseup', onMouseUp);
    canvas.addEventListener('mouseleave', onMouseUp);
    canvas.addEventListener('wheel', onMouseWheel);
    
    function addCone() {
      if (!coneImageLoaded && !coneImage.complete) {
        setTimeout(addCone, 50);
        return;
      }

      const el = {
        type: 'image',
        image: coneImage,
        x: 250,
        y: 250,
        size: 40,
        rotation: 0,
      };

      elements.push(el);
      selectedElement = el;
      draw();
    }

    function addBadge() {
      // Get selected badge from dropdown
      const select = document.getElementById('badgeSelect');
      const badgeFile = select.value;
      const img = badgeImageObjects[badgeFile];
      
      if (!img || !img.complete) {
        setTimeout(addBadge, 50);
        return;
      }

      // Place badge at bottom-center with appropriate size
      const el = {
        type: 'image',
        image: img,
        x: 500,  // center of 1000px canvas
        y: 850,  // near bottom
        size: 35,  // 35% to fit nicely as a banner
        rotation: 0,
      };

      elements.push(el);
      selectedElement = el;
      draw();
    }
    
    function selectBadge(index) {
      selectedBadgeIndex = index;
      
      // Update visual selection
      document.querySelectorAll('.badge-thumb').forEach((thumb, i) => {
        if (i === index) {
          thumb.classList.add('selected');
        } else {
          thumb.classList.remove('selected');
        }
      });
    }
    
    function deleteSelected() {
      if (!selectedElement) return;
      elements = elements.filter(e => e !== selectedElement);
      selectedElement = null;
      draw();
    }
    
    function downloadImage() {
      const wasSelected = selectedElement;
      selectedElement = null;
      draw();
      
      const link = document.createElement('a');
      link.download = `cade-conify-${currentFrame}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      selectedElement = wasSelected;
      draw();
    }
    
    // Upload handler
    document.getElementById('upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          backgroundImage = img;
          draw();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
    
    draw();
  </script>
</body>
</html>
