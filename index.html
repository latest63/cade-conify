<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CADE Conify — Party Cone PFP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #101010;
      --bg-card: #151515;
      --orange: #FF9D00;
      --purple: #8B2CFF;
      --white-warm: #F5F0E8;
      --black-outline: #0a0a0a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--white-warm);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      touch-action: none;
    }

    .app-shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 10px;
    }

    header {
      text-align: center;
      padding: 15px 0 10px;
    }

    .logo {
      font-family: 'Bangers', cursive;
      font-size: clamp(1.8rem, 7vw, 3rem);
      letter-spacing: 4px;
      color: var(--orange);
      -webkit-text-stroke: 2px #fff;
      paint-order: stroke fill;
      display: block;
      line-height: 1;
    }

    .logo span {
      color: var(--purple);
      -webkit-text-stroke: 2px #fff;
      paint-order: stroke fill;
      vertical-align: bottom;
      margin-left: 8px;
    }

    .tagline {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Layout */
    .editor-layout {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }

    .canvas-stage {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .tray {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: var(--bg-card);
      border: 2px solid #2a2a2a;
      border-radius: 4px;
    }

    .tray-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tray-divider {
      width: 2px;
      height: 40px;
      background: #333;
      align-self: center;
    }

    .tray-label {
      font-family: 'Bangers', cursive;
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: var(--orange);
      text-transform: uppercase;
      text-align: center;
    }

    .frame-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .frame-btn {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 4px;
      padding: 8px 4px;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 2px 2px 0 var(--black-outline);
      transition: all 0.1s;
    }

    .frame-btn:hover {
      background: var(--orange);
      color: #000;
      border-color: var(--orange);
      transform: translate(-1px, -1px);
    }

    .frame-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 10px 8px;
      font-family: 'Bangers', cursive;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--black-outline);
      transition: all 0.1s;
      white-space: nowrap;
    }

    .action-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--black-outline);
    }

    .action-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--black-outline);
    }

    .upload-btn {
      background: var(--orange);
      color: #000;
    }

    .download-btn {
      background: var(--orange);
      color: #000;
    }

    .delete-btn {
      background: #ff4444;
      color: #fff;
    }

    .cone-btn {
      background: var(--purple);
      color: #fff;
    }

    .hint-bar {
      background: #1a1a1a;
      border-left: 3px solid var(--orange);
      padding: 8px 12px;
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .hint-bar strong { color: var(--orange); }

    /* Slider styling */
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--orange);
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <h1 class="logo">CADE-<span>CONIFY</span></h1>
      <p class="tagline">☠️ Meme Madness Edition ☠️</p>
    </header>

    <div class="editor-layout">
      <div class="canvas-stage">
        <div class="canvas-wrapper">
          <canvas id="canvas" width="500" height="500"></canvas>
        </div>
        <div class="hint-bar">
          <strong>Tap Add Cone</strong> · <strong>Select</strong> cone to resize/rotate · <strong>Drag</strong> to move
        </div>
      </div>

      <div class="tray">
        <div class="tray-section">
          <div class="tray-label">Upload</div>
          <input type="file" id="upload" accept="image/*" style="display: none;">
          <button class="action-btn upload-btn" onclick="document.getElementById('upload').click()">📁 PFP</button>
        </div>

        <div class="tray-divider"></div>

        <div class="tray-section">
          <div class="tray-label">Frame</div>
          <div class="frame-grid">
            <button class="frame-btn active" data-frame="rect-1" onclick="selectFrame(this)">⬜ Rect 1</button>
            <button class="frame-btn" data-frame="rect-2" onclick="selectFrame(this)">⬜ Rect 2</button>
          </div>
        </div>

        <div class="tray-divider"></div>

        <div class="tray-section">
          <div class="tray-label">Cone</div>
          <button class="action-btn cone-btn" onclick="addCone()">🎩 Add Cone</button>
        </div>

        <div class="tray-divider"></div>

        <div class="tray-section">
          <div class="tray-label">PFP Scale</div>
          <div class="slider-container">
            <input type="range" id="scaleSlider" min="50" max="200" value="100" oninput="updatePfpScale(this.value)">
          </div>
        </div>

        <div class="tray-divider"></div>

        <div class="tray-section">
          <div class="tray-label">Actions</div>
          <div class="action-buttons">
            <button class="action-btn delete-btn" onclick="deleteSelected()">🗑 Delete</button>
            <button class="action-btn download-btn" onclick="downloadImage()">⬇ Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let backgroundImage = null;
    let pfpScale = 1.0;
    let elements = [];
    let selectedElement = null;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    let currentFrame = 'rect-1';
    
    // Load cone image
    const coneImage = new Image();
    coneImage.src = 'cone.png';
    coneImage.crossOrigin = 'anonymous';
    let coneImageLoaded = false;
    
    coneImage.onload = () => {
      coneImageLoaded = true;
      draw();
    };
    
    // Frames - rectangular only
    // No image files needed, drawn with canvas strokeRect

    // Draw rectangular frames (no fill, just outline)
    function drawRectFrame(ctx, x, y, w, h, style) {
      ctx.strokeStyle = style.color || '#FF9D00';
      ctx.lineWidth = style.width || 6;
      if (style.dashed) ctx.setLineDash(style.dashPattern || [12, 6]);

      ctx.strokeRect(x + 8, y + 8, w - 16, h - 16);
      ctx.setLineDash([]);
    }
    
    // Draw everything
    function draw() {
      // Clear
      ctx.fillStyle = '#101010';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Rectangular frame - no background color, just outline
      const rectStyles = {
        'rect-1': { color: '#FF9D00', width: 6 },
        'rect-2': { color: '#8B2CFF', width: 8, dashed: true, dashPattern: [15, 8] }
      };
      const style = rectStyles[currentFrame] || rectStyles['rect-1'];

      // Draw PFP scaled to fill canvas
      if (backgroundImage) {
        ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Draw frame border
      drawRectFrame(ctx, 0, 0, canvas.width, canvas.height, style);

      // Draw cone elements
      elements.forEach(el => {
        drawElement(el, el === selectedElement);
      });
    }
    
    function drawElement(el, selected) {
      const { w: nativeW, h: nativeH } = getDisplaySize(el);
      
      ctx.save();
      ctx.translate(el.x, el.y);
      ctx.rotate(el.rotation * Math.PI / 180);
      
      if (el.type === 'image' && el.image && el.image.complete) {
        ctx.drawImage(el.image, -nativeW/2, -nativeH/2, nativeW, nativeH);
      }
      
      // Selection indicators
      if (selected) {
        // Dashed selection box
        ctx.strokeStyle = '#FF9D00';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 3]);
        ctx.strokeRect(-nativeW/2 - 4, -nativeH/2 - 4, nativeW + 8, nativeH + 8);
        ctx.setLineDash([]);
        
        // Resize handle (bottom-right)
        ctx.fillStyle = '#FF9D00';
        ctx.fillRect(nativeW/2 - 8, nativeH/2 - 8, 16, 16);
        
        // Rotate handle (top-center with arc)
        const rotAngle = -Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(0, -nativeH/2);
        ctx.lineTo(-8, -nativeH/2 - 15);
        ctx.lineTo(8, -nativeH/2 - 15);
        ctx.closePath();
        ctx.fill();
        
        // Rotation arc indicator
        ctx.beginPath();
        ctx.arc(0, -nativeH/2, 12, rotAngle - 0.5, rotAngle + 0.5);
        ctx.strokeStyle = '#FF9D00';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      
      ctx.restore();
    }
    
    function getDisplaySize(el) {
      if (el.type === 'image' && el.image && el.image.complete) {
        const w = el.image.naturalWidth * (el.size / 100);
        const h = el.image.naturalHeight * (el.size / 100);
        return { w, h };
      }
      return { w: el.size, h: el.size };
    }
    
    function getElementAt(x, y) {
      for (let i = elements.length - 1; i >= 0; i--) {
        const el = elements[i];
        const { w: nw, h: nh } = getDisplaySize(el);
        const dist = Math.sqrt((x - el.x) ** 2 + (y - el.y) ** 2);
        if (dist < Math.max(nw, nh) / 2 + 10) return el;
      }
      return null;
    }
    
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }
    
    function onPointerDown(e) {
      e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      
      const el = getElementAt(x, y);
      if (el) {
        selectedElement = el;
        isDragging = true;
        dragOffset = { x: x - el.x, y: y - el.y };
        draw();
      } else {
        selectedElement = null;
        draw();
      }
    }
    
    function onPointerMove(e) {
      e.preventDefault();
      if (!isDragging || !selectedElement) return;
      
      const { x, y } = getCanvasCoords(e);
      selectedElement.x = x - dragOffset.x;
      selectedElement.y = y - dragOffset.y;
      draw();
    }
    
    function onPointerUp(e) {
      e.preventDefault();
      isDragging = false;
    }
    
    function addCone() {
      if (!coneImageLoaded && !coneImage.complete) {
        setTimeout(addCone, 50);
        return;
      }
      
      // Position cone centered in frame area
      const el = {
        type: 'image',
        image: coneImage,
        x: 250,
        y: 250,
        size: 100,  // 100% of natural size
        rotation: 0,
      };
      
      elements.push(el);
      selectedElement = el;
      draw();
    }
    
    function selectFrame(btn) {
      document.querySelectorAll('.frame-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFrame = btn.dataset.frame;
      draw();
    }
    
    function deleteSelected() {
      if (!selectedElement) return;
      elements = elements.filter(e => e !== selectedElement);
      selectedElement = null;
      draw();
    }
    
    function updatePfpScale(value) {
      pfpScale = value / 100;
      draw();
    }
    
    function downloadImage() {
      const wasSelected = selectedElement;
      selectedElement = null;
      draw();
      
      const link = document.createElement('a');
      link.download = `cade-conify-${currentFrame}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      selectedElement = wasSelected;
      draw();
    }
    
    // Event listeners
    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerUp);
    
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('touchend', onPointerUp, { passive: false });
    
    // Upload handler
    document.getElementById('upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          backgroundImage = img;
          draw();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
    
    draw();
  </script>
</body>
</html>
