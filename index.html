<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CADE Conify — Party Cone PFP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #101010;
      --bg-card: #151515;
      --orange: #FF9D00;
      --purple: #8B2CFF;
      --white-warm: #F5F0E8;
      --black-outline: #0a0a0a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--white-warm);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      touch-action: none;
    }

    .app-shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 10px;
    }

    header {
      text-align: center;
      padding: 15px 0 10px;
    }

    .logo {
      font-family: 'Bangers', cursive;
      font-size: clamp(1.8rem, 7vw, 3rem);
      letter-spacing: 4px;
      color: var(--orange);
      -webkit-text-stroke: 2px #fff;
      paint-order: stroke fill;
      display: block;
      line-height: 1;
    }

    .logo span {
      color: var(--purple);
      -webkit-text-stroke: 2px #fff;
      paint-order: stroke fill;
      vertical-align: bottom;
      margin-left: 8px;
    }

    .tagline {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Layout */
    .editor-layout {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }

    @media (min-width: 768px) {
      .editor-layout {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .canvas-stage {
      flex: 1;
      min-width: 0;
    }

    .canvas-wrapper {
      position: relative;
      background: var(--bg-card);
      border: 3px solid #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* Horizontal tray */
    .tray {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: var(--bg-card);
      border: 2px solid #2a2a2a;
      border-radius: 4px;
    }

    @media (min-width: 768px) {
      .tray {
        flex-direction: column;
        align-items: stretch;
        width: 280px;
        flex-shrink: 0;
      }
    }

    .tray-section {
      flex: 1;
      min-width: 120px;
    }

    .tray-label {
      font-family: 'Bangers', cursive;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--orange);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .frame-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .frame-btn {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 4px;
      padding: 8px 4px;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 2px 2px 0 var(--black-outline);
      transition: all 0.1s;
    }

    .frame-btn:hover {
      background: var(--orange);
      color: #000;
      border-color: var(--orange);
      transform: translate(-1px, -1px);
    }

    .frame-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 10px 8px;
      font-family: 'Bangers', cursive;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--black-outline);
      transition: all 0.1s;
      white-space: nowrap;
    }

    .action-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--black-outline);
    }

    .action-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--black-outline);
    }

    .upload-btn {
      background: var(--orange);
      color: #000;
    }

    .download-btn {
      background: var(--orange);
      color: #000;
    }

    .delete-btn {
      background: var(--red);
      color: #fff;
    }

    .hint-bar {
      background: #1a1a1a;
      border-left: 3px solid var(--orange);
      padding: 8px 12px;
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .hint-bar strong { color: var(--orange); }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <h1 class="logo">CADE <span>CONIFY</span></h1>
      <p class="tagline">☠️ Meme Madness Edition ☠️</p>
    </header>

    <div class="editor-layout">
      <div class="canvas-stage">
        <div class="canvas-wrapper">
          <canvas id="canvas" width="500" height="500"></canvas>
        </div>
        <div class="hint-bar">
          <strong>Tap</strong> canvas to place cone · <strong>Drag</strong> to move
        </div>
      </div>

      <div class="tray">
        <div class="tray-section">
          <div class="tray-label">Upload</div>
          <input type="file" id="upload" accept="image/*" style="display: none;">
          <button class="action-btn upload-btn" onclick="document.getElementById('upload').click()">📁 PFP</button>
        </div>

        <div class="tray-section">
          <div class="tray-label">Frame</div>
          <div class="frame-grid">
            <button class="frame-btn active" data-frame="meme-madness" onclick="selectFrame(this)">🎯 Madness</button>
            <button class="frame-btn" data-frame="qualifier" onclick="selectFrame(this)">🏆 Qualifier</button>
            <button class="frame-btn" data-frame="battle" onclick="selectFrame(this)">⚔️ Battle</button>
            <button class="frame-btn" data-frame="classic" onclick="selectFrame(this)">🎉 Classic</button>
          </div>
        </div>

        <div class="tray-section">
          <div class="tray-label">Actions</div>
          <div class="action-buttons">
            <button class="action-btn delete-btn" onclick="deleteSelected()">🗑 Delete</button>
            <button class="action-btn download-btn" onclick="downloadImage()">⬇ Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let backgroundImage = null;
    let elements = [];
    let selectedElement = null;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    let currentFrame = 'meme-madness';
    
    // Load cone image
    const coneImage = new Image();
    coneImage.src = 'cone.png';
    coneImage.crossOrigin = 'anonymous';
    let coneImageLoaded = false;
    
    coneImage.onload = () => {
      coneImageLoaded = true;
      draw();
    };
    
    // Frames
    const frames = {
      'meme-madness': { bgColor: '#1a0a00', borderColor: '#FF9D00', hasBorder: true, pos: { x: 250, y: 140 }, size: 18 },
      'qualifier': { bgColor: '#0a1a0a', borderColor: '#00E676', hasBorder: true, pos: { x: 250, y: 140 }, size: 18 },
      'battle': { bgColor: '#1a0a1a', borderColor: '#8B2CFF', hasBorder: true, pos: { x: 250, y: 140 }, size: 18, dashed: true },
      'classic': { bgColor: '#101010', hasBorder: false, pos: { x: 250, y: 130 }, size: 16 }
    };

    function getDisplaySize(el) {
      if (el.type === 'image' && el.image && el.image.complete) {
        const w = el.image.naturalWidth * (el.size / 100);
        const h = el.image.naturalHeight * (el.size / 100);
        return { w, h };
      }
      return { w: el.size, h: el.size };
    }

    function draw() {
      const frame = frames[currentFrame];
      
      // Background
      ctx.fillStyle = frame.bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Border
      if (frame.hasBorder) {
        ctx.strokeStyle = frame.borderColor;
        ctx.lineWidth = frame.dashed ? 4 : 6;
        if (frame.dashed) ctx.setLineDash([12, 6]);
        ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
        ctx.setLineDash([]);
      }
      
      // Background image
      if (backgroundImage) {
        ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
      }
      
      // Draw elements
      elements.forEach(el => {
        drawElement(el, el === selectedElement);
      });
    }
    
    function drawElement(el, selected) {
      const { w: nativeW, h: nativeH } = getDisplaySize(el);
      
      ctx.save();
      ctx.translate(el.x, el.y);
      ctx.rotate(el.rotation * Math.PI / 180);
      
      if (el.type === 'image' && el.image && el.image.complete) {
        ctx.drawImage(el.image, -nativeW/2, -nativeH/2, nativeW, nativeH);
      }
      
      // Selection indicator (simple)
      if (selected) {
        ctx.restore();
        ctx.save();
        ctx.translate(el.x, el.y);
        ctx.strokeStyle = '#FF9D00';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 3]);
        ctx.strokeRect(-nativeW/2 - 5, -nativeH/2 - 5, nativeW + 10, nativeH + 10);
        ctx.setLineDash([]);
      }
      
      ctx.restore();
    }
    
    // Get element at position
    function getElementAt(x, y) {
      for (let i = elements.length - 1; i >= 0; i--) {
        const el = elements[i];
        const { w: nw, h: nh } = getDisplaySize(el);
        const dist = Math.sqrt((x - el.x) ** 2 + (y - el.y) ** 2);
        if (dist < Math.max(nw, nh) / 2 + 10) return el;
      }
      return null;
    }
    
    // Get canvas coordinates
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }
    
    // Pointer handlers
    function onPointerDown(e) {
      e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      
      if (elements.length === 0) {
        addCone();
        return;
      }
      
      const el = getElementAt(x, y);
      if (el) {
        selectedElement = el;
        isDragging = true;
        dragOffset = { x: x - el.x, y: y - el.y };
        draw();
      } else {
        selectedElement = null;
        draw();
      }
    }
    
    function onPointerMove(e) {
      e.preventDefault();
      if (!isDragging || !selectedElement) return;
      
      const { x, y } = getCanvasCoords(e);
      selectedElement.x = x - dragOffset.x;
      selectedElement.y = y - dragOffset.y;
      draw();
    }
    
    function onPointerUp(e) {
      e.preventDefault();
      isDragging = false;
    }
    
    function addCone() {
      if (!coneImageLoaded && !coneImage.complete) {
        setTimeout(addCone, 50);
        return;
      }
      
      const frame = frames[currentFrame];
      const el = {
        type: 'image',
        image: coneImage,
        x: frame.pos.x,
        y: frame.pos.y,
        size: frame.size,
        rotation: 0,
      };
      
      elements.push(el);
      selectedElement = el;
      draw();
    }
    
    function selectFrame(btn) {
      document.querySelectorAll('.frame-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFrame = btn.dataset.frame;
      
      // Reset cone position for new frame
      if (elements.length > 0) {
        const frame = frames[currentFrame];
        elements[0].x = frame.pos.x;
        elements[0].y = frame.pos.y;
        elements[0].size = frame.size;
        draw();
      }
    }
    
    function deleteSelected() {
      if (!selectedElement) return;
      elements = elements.filter(e => e !== selectedElement);
      selectedElement = null;
      draw();
    }
    
    function downloadImage() {
      const wasSelected = selectedElement;
      selectedElement = null;
      draw();
      
      const link = document.createElement('a');
      link.download = `cade-meme-madness-${currentFrame}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      selectedElement = wasSelected;
      draw();
    }
    
    // Event listeners
    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerUp);
    
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('touchend', onPointerUp, { passive: false });
    
    // Upload handler
    document.getElementById('upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          backgroundImage = img;
          draw();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
    
    draw();
  </script>
</body>
</html>
