<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CADE Conify — Party Cone PFP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #101010;
      --bg-card: #151515;
      --orange: #FF9D00;
      --orange-bright: #FFB000;
      --purple: #8B2CFF;
      --purple-dark: #6A00FF;
      --white-warm: #F5F0E8;
      --green: #00E676;
      --red: #FF3D71;
      --black-outline: #0a0a0a;
      --shadow-offset: 4px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--white-warm);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 8px 8px;
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header { text-align: center; padding: 30px 0 20px; }

    .logo {
      font-family: 'Bangers', cursive;
      font-size: 3.5rem;
      letter-spacing: 4px;
      color: var(--orange);
      -webkit-text-stroke: 2px #fff;
      paint-order: stroke fill;
      transform: rotate(-2deg);
      display: block;
      line-height: 1.1;
    }

    .logo span {
      color: var(--purple);
      -webkit-text-stroke: 2px #fff;
      paint-order: stroke fill;
      vertical-align: bottom;
      margin-left: 8px;
    }

    .tagline {
      font-size: 0.85rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .editor-layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      margin-top: 30px;
    }

    @media (max-width: 900px) {
      .editor-layout { flex-direction: column; align-items: center; }
    }

    .canvas-stage { flex: 1; max-width: 520px; }

    .canvas-wrapper {
      position: relative;
      background: var(--bg-card);
      border: 3px solid #2a2a2a;
      border-radius: 4px;
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--black-outline);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
    }

    .conify-burst {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      color: var(--orange);
      text-shadow: 2px 2px 0 var(--black-outline);
      animation: burst-pop 0.6s ease-out forwards;
    }

    @keyframes burst-pop {
      0% { transform: scale(0) rotate(-20deg); opacity: 1; }
      50% { transform: scale(1.3) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg) translateY(-40px); opacity: 0; }
    }

    .sidebar {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .card {
      background: var(--bg-card);
      border: 2px solid #2a2a2a;
      border-radius: 4px;
      padding: 16px;
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--black-outline);
      transition: transform 0.15s;
    }

    .card:hover { transform: translate(-1px, -1px); }

    .card-title {
      font-family: 'Bangers', cursive;
      font-size: 1rem;
      letter-spacing: 2px;
      color: var(--orange);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--purple);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background: var(--orange);
      color: #000;
      font-family: 'Bangers', cursive;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--black-outline);
      transition: all 0.1s;
    }

    .upload-btn:hover {
      background: var(--orange-bright);
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--black-outline);
    }

    .upload-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--black-outline);
    }

    input[type="file"] { display: none; }

    /* Frame selector */
    .frame-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .frame-btn {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 4px;
      padding: 12px 8px;
      color: #fff;
      font-size: 0.7rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 2px 2px 0 var(--black-outline);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .frame-btn:hover {
      background: var(--orange);
      color: #000;
      border-color: var(--orange);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--black-outline);
    }

    .frame-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    .frame-btn .frame-preview {
      width: 100%;
      height: 40px;
      background: #0a0a0a;
      border-radius: 2px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    /* Sliders */
    .slider-group { margin-bottom: 14px; }

    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .slider-group label span { color: var(--orange); font-weight: 700; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--orange);
      cursor: pointer;
    }

    .action-row { display: flex; flex-direction: column; gap: 8px; }

    .action-btn {
      width: 100%;
      padding: 12px 16px;
      font-family: 'Bangers', cursive;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--black-outline);
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--black-outline); }
    .action-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--black-outline); }

    .action-btn.orange { background: var(--orange); color: #000; }
    .action-btn.purple { background: var(--purple); color: #fff; }
    .action-btn.red { background: var(--red); color: #fff; }

    .hint-bar {
      background: #1a1a1a;
      border-left: 3px solid var(--orange);
      padding: 10px 14px;
      font-size: 0.7rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    .hint-bar strong { color: var(--orange); }

    .lightning {
      position: fixed;
      opacity: 0.04;
      pointer-events: none;
      font-size: 20rem;
      color: var(--orange);
      font-family: 'Bangers', cursive;
      z-index: 0;
    }

    .lightning-1 { top: -50px; left: -50px; }
    .lightning-2 { bottom: -80px; right: -30px; color: var(--purple); }

    .ripped-edge {
      height: 8px;
      background: var(--bg-deep);
      background-image: linear-gradient(135deg, transparent 33.33%, var(--bg-card) 33.33%, var(--bg-card) 66.66%, transparent 66.66%),
                        linear-gradient(225deg, transparent 33.33%, var(--bg-card) 33.33%, var(--bg-card) 66.66%, transparent 66.66%);
      background-size: 16px 8px;
      background-position: 0 0, 8px 0;
    }
  </style>
</head>
<body>
  <div class="lightning lightning-1">⚡</div>
  <div class="lightning lightning-2">⚡</div>

  <div class="app-shell">
    <header>
      <h1 class="logo">CADE <span>CONIFY</span></h1>
      <p class="tagline">☠️ Meme Madness Edition ☠️</p>
    </header>

    <div class="ripped-edge"></div>

    <div class="editor-layout">
      <div class="canvas-stage">
        <div class="canvas-wrapper">
          <canvas id="canvas" width="500" height="500"></canvas>
        </div>
        <div class="hint-bar" style="margin-top: 10px;">
          <strong>How to:</strong> Upload PFP → Pick frame → Click to place cone → Drag to move → Adjust size/rotate → Download
        </div>
      </div>

      <div class="sidebar">
        <!-- Upload -->
        <div class="card">
          <div class="card-title">Upload PFP</div>
          <input type="file" id="upload" accept="image/*">
          <button class="upload-btn" onclick="document.getElementById('upload').click()">
            📁 Choose Image
          </button>
        </div>

        <!-- Frames -->
        <div class="card">
          <div class="card-title">Select Frame</div>
          <div class="frame-grid">
            <button class="frame-btn active" data-frame="meme-madness" onclick="selectFrame(this)">
              <div class="frame-preview">🎯</div>
              Meme Madness
            </button>
            <button class="frame-btn" data-frame="qualifier" onclick="selectFrame(this)">
              <div class="frame-preview">🏆</div>
              Qualifier
            </button>
            <button class="frame-btn" data-frame="battle" onclick="selectFrame(this)">
              <div class="frame-preview">⚔️</div>
              Battle
            </button>
            <button class="frame-btn" data-frame="classic" onclick="selectFrame(this)">
              <div class="frame-preview">🎉</div>
              Classic
            </button>
          </div>
        </div>

        <!-- Transform -->
        <div class="card">
          <div class="card-title">Transform</div>
          <div class="slider-group">
            <label>Size <span id="size-val">100%</span></label>
            <input type="range" id="size" min="20" max="250" value="100">
          </div>
          <div class="slider-group">
            <label>Rotate <span id="rotate-val">0°</span></label>
            <input type="range" id="rotate" min="-180" max="180" value="0">
          </div>
        </div>

        <!-- Actions -->
        <div class="card">
          <div class="card-title">Actions</div>
          <div class="action-row">
            <button class="action-btn red" onclick="deleteSelected()">🗑 Delete Cone</button>
            <button class="action-btn orange" onclick="downloadImage()">⬇ Download PNG</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let backgroundImage = null;
    let elements = [];
    let selectedElement = null;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    let currentFrame = 'meme-madness';
    
    // Load the actual cone image
    const coneImage = new Image();
    coneImage.src = 'cone.png';
    coneImage.crossOrigin = 'anonymous';
    
    // Frame configurations
    const frames = {
      'meme-madness': {
        name: 'Meme Madness',
        bgColor: '#1a0a00',
        accentColor: '#FF9D00',
        hasBorder: true,
        borderColor: '#FF9D00',
        borderStyle: 'solid',
        coneDefaultPos: { x: 250, y: 140 },
        coneDefaultSize: 30,
      },
      'qualifier': {
        name: 'Qualifier',
        bgColor: '#0a1a0a',
        accentColor: '#00E676',
        hasBorder: true,
        borderColor: '#00E676',
        borderStyle: 'solid',
        coneDefaultPos: { x: 250, y: 140 },
        coneDefaultSize: 30,
      },
      'battle': {
        name: 'Battle',
        bgColor: '#1a0a1a',
        accentColor: '#8B2CFF',
        hasBorder: true,
        borderColor: '#8B2CFF',
        borderStyle: 'dashed',
        coneDefaultPos: { x: 250, y: 140 },
        coneDefaultSize: 30,
      },
      'classic': {
        name: 'Classic',
        bgColor: '#101010',
        accentColor: '#FF9D00',
        hasBorder: false,
        coneDefaultPos: { x: 250, y: 120 },
        coneDefaultSize: 28,
      }
    };

    function draw() {
      const frame = frames[currentFrame];
      
      // Clear with frame background
      ctx.fillStyle = frame.bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw border if enabled
      if (frame.hasBorder) {
        ctx.strokeStyle = frame.borderColor;
        ctx.lineWidth = frame.borderStyle === 'dashed' ? 4 : 6;
        if (frame.borderStyle === 'dashed') {
          ctx.setLineDash([12, 6]);
        }
        ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
        ctx.setLineDash([]);
      }
      
      // Draw halftone pattern
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      for (let x = 4; x < canvas.width; x += 8) {
        for (let y = 4; y < canvas.height; y += 8) {
          ctx.beginPath();
          ctx.arc(x, y, 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      // Draw background if exists
      if (backgroundImage) {
        ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
      }
      
      // Draw elements (cone)
      elements.forEach(el => {
        drawElement(el, el === selectedElement);
      });
    }
    
    function drawElement(el, selected) {
      ctx.save();
      ctx.translate(el.x, el.y);
      ctx.rotate(el.rotation * Math.PI / 180);
      ctx.scale(el.size / 100, el.size / 100);
      
      if (el.type === 'image' && el.image && el.image.complete) {
        const w = el.image.naturalWidth;
        const h = el.image.naturalHeight;
        const scale = el.size / 100;
        ctx.drawImage(el.image, -w*scale/2, -h*scale/2, w*scale, h*scale);
      }
      
      if (selected) {
        ctx.restore();
        ctx.save();
        ctx.translate(el.x, el.y);
        ctx.strokeStyle = '#FF9D00';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 4]);
        // Draw selection box around the element based on its rendered size
        const displayW = (el.type === 'image' && el.image) ? el.image.naturalWidth * (el.size / 100) : el.size;
        const displayH = (el.type === 'image' && el.image) ? el.image.naturalHeight * (el.size / 100) : el.size;
        ctx.strokeRect(-displayW/2 - 5, -displayH/2 - 5, displayW + 10, displayH + 10);
        ctx.setLineDash([]);
      }
      
      ctx.restore();
    }
    
    document.getElementById('upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          backgroundImage = img;
          draw();
          showBurst('UPLOADED!', canvas.width/2, 40);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
    
    function selectFrame(btn) {
      document.querySelectorAll('.frame-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFrame = btn.dataset.frame;
      
      // Reset cone position for new frame
      if (elements.length > 0) {
        const frame = frames[currentFrame];
        elements[0].x = frame.coneDefaultPos.x;
        elements[0].y = frame.coneDefaultPos.y;
        elements[0].size = frame.coneDefaultSize;
        updateTransform();
      }
      
      draw();
      showBurst('FRAME!', canvas.width/2, canvas.height - 50);
    }
    
    function addCone() {
      const frame = frames[currentFrame];
      const el = {
        type: 'image',
        image: coneImage,
        x: frame.coneDefaultPos.x,
        y: frame.coneDefaultPos.y,
        size: frame.coneDefaultSize,
        rotation: 0,
      };
      
      elements.push(el);
      selectElement(el);
      draw();
      showBurst('POW!', el.x, el.y);
    }
    
    function selectElement(el) {
      selectedElement = el;
      updateTransform();
      draw();
    }
    
    function deleteSelected() {
      if (!selectedElement) return;
      elements = elements.filter(e => e !== selectedElement);
      selectedElement = null;
      updateTransform();
      draw();
    }
    
    function updateTransform() {
      if (!selectedElement) return;
      document.getElementById('size').value = selectedElement.size;
      document.getElementById('size-val').textContent = selectedElement.size + '%';
      document.getElementById('rotate').value = selectedElement.rotation;
      document.getElementById('rotate-val').textContent = selectedElement.rotation + '°';
    }
    
    document.getElementById('size').addEventListener('input', (e) => {
      if (!selectedElement) return;
      selectedElement.size = parseInt(e.target.value);
      document.getElementById('size-val').textContent = selectedElement.size + '%';
      draw();
    });
    
    document.getElementById('rotate').addEventListener('input', (e) => {
      if (!selectedElement) return;
      selectedElement.rotation = parseInt(e.target.value);
      document.getElementById('rotate-val').textContent = selectedElement.rotation + '°';
      draw();
    });
    
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      
      if (elements.length === 0) {
        // Add cone on first click
        addCone();
        return;
      }
      
      for (let i = elements.length - 1; i >= 0; i--) {
        const el = elements[i];
        const dist = Math.sqrt((x - el.x) ** 2 + (y - el.y) ** 2);
        if (dist < el.size * 3) {
          selectElement(el);
          isDragging = true;
          dragOffset = { x: x - el.x, y: y - el.y };
          return;
        }
      }
      
      selectedElement = null;
      updateTransform();
      draw();
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging || !selectedElement) return;
      
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      selectedElement.x = (e.clientX - rect.left) * scaleX - dragOffset.x;
      selectedElement.y = (e.clientY - rect.top) * scaleY - dragOffset.y;
      draw();
    });
    
    canvas.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mouseleave', () => { isDragging = false; });
    
    function showBurst(text, x, y) {
      const burst = document.createElement('div');
      burst.className = 'conify-burst';
      burst.textContent = text;
      burst.style.left = x + 'px';
      burst.style.top = y + 'px';
      document.body.appendChild(burst);
      setTimeout(() => burst.remove(), 700);
    }
    
    function downloadImage() {
      const wasSelected = selectedElement;
      selectedElement = null;
      draw();
      
      const link = document.createElement('a');
      link.download = `cade-meme-madness-${currentFrame}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      selectedElement = wasSelected;
      draw();
      showBurst('SAVED!', canvas.width/2, canvas.height - 50);
    }
    
    draw();
  </script>
</body>
</html>
